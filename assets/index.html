<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracksheet Generator</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eee;
    --text-dim: #8892a4;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .container { width: 100%; max-width: 560px; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .file-list {
    min-height: 160px;
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    background: rgba(0,0,0,0.2);
  }
  .file-list:empty::after {
    content: 'No files added';
    display: block;
    text-align: center;
    padding: 48px 0;
    color: var(--text-dim);
    font-size: 13px;
  }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
    cursor: default;
    transition: background 0.15s;
  }
  .file-item:hover { background: rgba(255,255,255,0.04); }
  .file-item:last-child { border-bottom: none; }
  .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item .remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .file-item .remove:hover { color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .btn-danger {
    background: rgba(233,69,96,0.15);
    color: var(--accent);
  }
  .btn-danger:hover { background: rgba(233,69,96,0.25); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    padding: 14px;
    font-size: 15px;
    width: 100%;
    flex: none;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .status {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 12px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: var(--shadow);
    transition: transform 0.3s ease;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--accent); }
  .toast.success { background: #2ecc71; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h1>Tracksheet Generator</h1>
  <p class="subtitle">Select CSV job order reports to generate tracksheets</p>

  <div class="card">
    <div class="file-list" id="fileList"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="addFiles()">+ Add CSV Files</button>
      <button class="btn btn-secondary" onclick="removeSelected()">Remove Selected</button>
      <button class="btn btn-danger" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <button class="btn btn-primary" id="genBtn" onclick="generate()">Generate Tracksheets</button>
  <p class="status" id="status">No files selected</p>
</div>

<div class="toast" id="toast"></div>

<script>
  let files = [];
  let selectedIndex = -1;

  function render() {
    const list = document.getElementById('fileList');
    list.innerHTML = '';
    files.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'file-item' + (i === selectedIndex ? ' selected' : '');
      div.innerHTML = `<span class="name">${f.name}</span><button class="remove" onclick="event.stopPropagation();removeAt(${i})">&times;</button>`;
      div.onclick = () => { selectedIndex = i; render(); };
      list.appendChild(div);
    });
    document.getElementById('status').textContent = files.length
      ? `${files.length} file${files.length > 1 ? 's' : ''} selected`
      : 'No files selected';
  }

  async function addFiles() {
    const paths = await window.pywebview.api.add_files();
    if (paths) {
      paths.forEach(p => {
        if (!files.find(f => f.path === p.path)) files.push(p);
      });
      selectedIndex = -1;
      render();
    }
  }

  function removeAt(i) {
    files.splice(i, 1);
    if (selectedIndex >= files.length) selectedIndex = -1;
    render();
  }

  function removeSelected() {
    if (selectedIndex >= 0) removeAt(selectedIndex);
  }

  function clearAll() {
    files = [];
    selectedIndex = -1;
    render();
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 3000);
  }

  async function generate() {
    if (!files.length) { showToast('Please add CSV files first', 'error'); return; }
    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.textContent = 'Generating...';

    const result = await window.pywebview.api.generate(files.map(f => f.path));

    btn.disabled = false;
    btn.textContent = 'Generate Tracksheets';

    if (result.errors && result.errors.length) {
      showToast(result.errors.join(', '), 'error');
    } else {
      showToast(`Generated ${result.count} tracksheet(s)`, 'success');
    }
  }

  render();
</script>
</body>
</html>
