<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E75B6"/>
      <stop offset="100%" style="stop-color:#1F4E79"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Table grid -->
  <g transform="translate(100, 120)" fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
    <!-- Header row -->
    <rect x="0" y="0" width="312" height="44" rx="6" fill="rgba(255,255,255,0.2)"/>
    <line x1="60" y1="0" x2="60" y2="260"/>
    <line x1="140" y1="0" x2="140" y2="260"/>
    <line x1="220" y1="0" x2="220" y2="260"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="52" x2="312" y2="52"/>
    <line x1="0" y1="104" x2="312" y2="104"/>
    <line x1="0" y1="156" x2="312" y2="156"/>
    <line x1="0" y1="208" x2="312" y2="208"/>
    <line x1="0" y1="260" x2="312" y2="260"/>
    <!-- Status dots -->
    <circle cx="268" cy="78" r="8" fill="#4CAF50" stroke="none"/>
    <circle cx="268" cy="130" r="8" fill="#4CAF50" stroke="none"/>
    <circle cx="268" cy="182" r="8" fill="#FF9800" stroke="none"/>
    <circle cx="268" cy="234" r="8" fill="#4CAF50" stroke="none"/>
  </g>
  <!-- Corner accent -->
  <rect x="80" y="400" width="120" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>
  <rect x="80" y="420" width="80" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
</svg>
