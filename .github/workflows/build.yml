name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-gi python3-gi-cairo python3-cairo \
            python3-pip python3-venv \
            pkg-config libgirepository1.0-dev \
            libcairo2-dev

      - name: Setup Python venv with deps
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pyinstaller pandas openpyxl

      - name: Build with PyInstaller
        run: |
          .venv/bin/pyinstaller --onefile --windowed \
            --name tracksheet-gen \
            --add-data "assets/icon.svg:assets" \
            --hidden-import gen_tracksheet \
            gen_tracksheet_gui.py

      - name: Package
        run: |
          tar -czf tracksheet-gen-linux.tar.gz -C dist tracksheet-gen

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tracksheet-gen-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyinstaller pandas openpyxl

      - name: Note
        run: |
          echo "GTK4+PyGObject is not available on Windows via pip."
          echo "Windows build requires MSYS2 GTK4 or alternative GUI."
          echo "Skipping Windows build for now."

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: linux/tracksheet-gen-linux.tar.gz
