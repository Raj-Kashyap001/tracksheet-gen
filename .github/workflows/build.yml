name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv python3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config imagemagick

      - name: Generate icons
        run: |
          convert -background none assets/icon.svg -resize 256x256 assets/icon.png

      - name: Install Python deps
        run: |
          sudo pip3 install pyinstaller pandas openpyxl pywebview

      - name: Build with PyInstaller
        run: |
          pyinstaller tracksheet-gen.spec

      - name: Package
        run: tar -czf tracksheet-gen-linux.tar.gz -C dist tracksheet-gen

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tracksheet-gen-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate icons
        run: |
          pip install cairosvg Pillow
          python -c "import cairosvg; cairosvg.svg2png(url='assets/icon.svg', write_to='assets/icon.png', output_width=256, output_height=256)"
          python -c "from PIL import Image; img=Image.open('assets/icon.png'); img.save('assets/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Install deps
        run: pip install pyinstaller pandas openpyxl pywebview Pillow

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon assets/icon.ico tracksheet-gen.spec

      - name: Package
        run: 7z a tracksheet-gen-windows.zip dist/tracksheet-gen.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tracksheet-gen-windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/tracksheet-gen-linux.tar.gz
            windows/tracksheet-gen-windows.zip
